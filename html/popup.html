<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images Replace Configs</title>
    <link rel="stylesheet" href="../css/popup.css">
</head>
<body>
<main class="popup">
    <section class="config-item">
        <div class="toggle">
            <label for="enabled" id="lbl_enabled">Enabled</label>
            <label class="switch">
                <input id="enabled" type="checkbox" aria-describedby="lbl_enabled">
                <span class="slider round"></span>
            </label>
        </div>
    </section>
    <section class="config-item">
        <label for="replace_url" id="lbl_replace_url">Replace URL</label>
        <input type="url" id="replace_url" placeholder="https://example.com" aria-describedby="msg">
    </section>

    <span id="msg" role="alert" aria-live="assertive" aria-atomic="true"></span>
</main>
<script src="../js/popup.js"></script>
</body>
</html>
